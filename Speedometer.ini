[SETTINGS]
; ==============================================================================
; AFOUND MODS - ENHANCED VEHICLE HUD SYSTEM
; ==============================================================================

; Gaya Tampilan Speedometer (0 = Minimalis / Minimap, 1 = Forza Horizon Kanan Bawah)
SpeedometerStyle=0
ForzaPosX=0.8900
ForzaPosY=0.8250
ForzaScale=1.00

; Posisi Normal di Atas Minimap (0.0 sampai 1.0)
PosX=0.0160
PosY=0.7400

; Ukuran Skala Font Normal
SpeedScale=0.70
UnitScale=0.34
GearScale=0.68

; Posisi & Ukuran Center High-Speed Mode
CenterPosX=0.5000
CenterPosY=0.8500
CenterSpeedScale=1.10

; Auto-Hide saat diam 0 km/h selama 3 detik (1 = Aktif, 0 = Nonaktif)
AutoHideAtZero=0

; Ambang Batas Kecepatan untuk Pindah ke Center (km/h, 0 = Nonaktif)
CenterSpeedThreshold=70

; Jeda Waktu Cooldown Perpindahan Center (detik)
CenterCooldownSec=2

; Warna Teks Utama (RGB: 0 - 255)
TextColorR=255
TextColorG=255
TextColorB=255

; Warna Outline / Drop Shadow Teks (RGB: 0 - 255)
OutlineColorR=0
OutlineColorG=0
OutlineColorB=0

; Transparansi / Opasitas Teks (30 - 255)
TextOpacity=255

; Interval Pembaruan Angka Speedometer (ms)
SpeedIntervalMs=230

; Elemen yang Ditampilkan (1 = Aktif, 0 = Nonaktif)
ShowSpeedo=1
ShowGear=1
ShowVehicleName=1
ShowFps=1
ShowClock=1
ShowRam=0
ShowCpu=1
ShowGpu=1
ShowDisk=0
ShowFuel=1
ShowDamage=1

; Tombol Shortcut Keyboard:
; - F12 (123) : Buka / Tutup Menu "AFOUND MODS" (Klik langsung tanpa tahan)
; - 'L' (76)  : Toggle Master ESP On / Off
; - ']' (221) : Toggle Show / Hide Speedometer
MenuKey=123
EspToggleKey=76
SpeedoToggleKey=221
ToggleKey=123
ShowAltitude=1
ShowOnFootSpeed=1
ShowRealTime=1
HudTextOutline=1
HudTextOpacity=255
Language=0

